<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Impressum – deine Misere!</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,Helvetica,sans-serif;line-height:1.6;padding:40px}a{color:#fff}.box{max-width:800px;margin:auto;border:1px solid rgba(255,255,255,.15);padding:32px;background:#111}h1{text-transform:uppercase;letter-spacing:.15em}h2{margin-top:28px}#status{color:#aaa}</style></head><body><div class="box"><h1>Impressum</h1><div id="status">Lade…</div><div id="impressum"></div><p><a href="index.html">Zurück zur Website</a></p></div><script>
(async()=>{try{const r=await fetch('content.json',{cache:'no-store'});if(!r.ok)throw new Error();const c=await r.json(),i=c.impressum||{};const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let out='';if(i.name)out+='<p><strong>'+esc(i.name)+'</strong></p>';if(i.address)out+='<p>'+esc(i.address).replace(/\n/g,'<br>')+'</p>';if(i.email)out+='<p>E-Mail: <a href="mailto:'+encodeURIComponent(i.email)+'">'+esc(i.email)+'</a></p>';if(i.phone)out+='<p>Telefon: '+esc(i.phone)+'</p>';if(i.responsible)out+='<p><strong>Verantwortlich für den Inhalt:</strong><br>'+esc(i.responsible)+'</p>';if(i.vatId)out+='<p><strong>USt-IdNr.:</strong> '+esc(i.vatId)+'</p>';if(i.register)out+='<p><strong>Register:</strong> '+esc(i.register)+'</p>';if(i.additional)out+='<p>'+esc(i.additional).replace(/\n/g,'<br>')+'</p>';if(!out)out='<p>Die Impressumsdaten werden über das CMS ergänzt.</p>';document.getElementById('impressum').innerHTML=out;document.getElementById('status').textContent='';}catch(e){document.getElementById('status').textContent='Die Impressumsdaten konnten nicht geladen werden.';}})();</script></body></html>
